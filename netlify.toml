# =============================================================================
# CareerAI — Netlify Configuration
# Production SPA Build & Routing Specification
# =============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Security & Performance Headers (Lighthouse 100/100)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA Routing: Redirect all routes to index.html with 200 to prevent 404s on page refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
