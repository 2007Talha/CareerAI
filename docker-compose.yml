version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension for semantic matching
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: careerai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerai
      POSTGRES_PASSWORD: careerai_dev
      POSTGRES_DB: careerai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://careerai:careerai_dev@db:5432/careerai
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./prompts:/prompts
      - ./ml:/ml
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # React + Vite Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
